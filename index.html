<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary meta ── -->
    <title>Notes</title>
    <meta name="description" content="Your personal dark-mode notes app" />
    <meta name="theme-color" content="#000000" />

    <!-- ── iOS / Safari PWA ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- ── Splash screens (iPhone sizes) ── -->
    <!-- These are optional but give a native feel on iOS -->
    <!-- You can generate them at https://progressier.com/pwa-icons-and-ios-splash-screen-generator -->

    <!-- ── Android / Chrome ── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Notes" />

    <!-- ── Open Graph (optional, for sharing link previews) ── -->
    <meta property="og:title" content="Notes" />
    <meta property="og:description" content="Your personal dark-mode notes app" />
    <meta property="og:type" content="website" />

    <!-- ── Prevent phone number detection ── -->
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Prevent flash of white before React mounts */
      html, body, #root {
        background: #000000;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        /* iOS safe area support */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* Prevent text size adjustment on orientation change */
      body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      /* Hide scrollbar on mobile */
      ::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
